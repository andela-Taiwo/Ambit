[project]
name = "finance-backend"
version = "0.1.0"
description = "Personal finance & investment tracker - backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.8",
    "psycopg[binary]>=3.2",
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
# `disallow_any_explicit` is deliberately off: Pydantic's own Field/validator
# signatures are typed with Any, so enabling it would force blanket ignores --
# the exact escape hatch the plan forbids. Full --strict remains on.
warn_unreachable = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --cov=app --cov-report=term-missing --cov-report=xml"
markers = [
    "integration: tests requiring a real Postgres via Testcontainers",
]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy's async bridge runs ORM code inside greenlets; without this,
# service-layer lines executed during async DB work are never traced.
concurrency = ["greenlet", "thread"]
omit = ["app/db/migrations/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
