name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.5.11'
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

      # The committed schema is the frontend's contract; a stale one means the
      # generated client would drift from the real API.
      - name: OpenAPI schema is up to date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code openapi.json

      # Testcontainers starts a real Postgres via the runner's Docker daemon,
      # so integration tests hit the same engine as production.
      - name: Tests + coverage gate
        run: uv run pytest
        env:
          APP_ENV: ci

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: ESLint
        run: yarn lint

      - name: Prettier check
        run: yarn format:check

      - name: tsc --noEmit
        run: yarn typecheck

      - name: Vitest + coverage gate
        run: yarn test:coverage

      - name: Build
        run: yarn build
        env:
          VITE_API_BASE_URL: http://localhost:8000

  e2e:
    name: E2E (Playwright, full stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U finance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://finance:finance@localhost:5432/finance
      SECRET_KEY: ci-secret-key-not-used-in-any-real-environment
      APP_ENV: ci
      CORS_ORIGINS: http://localhost:4173
      VITE_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.5.11'
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run migrations
        working-directory: backend
        run: uv run python -m app.db.migrate

      - name: Start backend
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ready; then exit 0; fi
            sleep 1
          done
          echo "backend failed to become ready" >&2
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: yarn build

      - name: Install Playwright browsers
        working-directory: frontend
        run: yarn playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: frontend
        run: yarn test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: VITE_API_BASE_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.5.11'

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: pip-audit (backend dependencies)
        working-directory: backend
        # Audit the locked third-party dependencies, not the installed env:
        # the env includes this project itself (finance-backend), which is not
        # on PyPI, and --strict turns that skip into a failure.
        run: |
          uv export --frozen --no-emit-project --format requirements-txt \
            -o "$RUNNER_TEMP/requirements-audit.txt"
          uvx pip-audit --strict --disable-pip -r "$RUNNER_TEMP/requirements-audit.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: yarn audit (frontend dependencies)
        working-directory: frontend
        run: yarn npm audit --severity high || yarn audit --level high

      - name: gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
