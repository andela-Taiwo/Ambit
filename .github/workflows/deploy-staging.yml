name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: VITE_API_BASE_URL=${{ vars.STAGING_API_URL }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Terraform apply + migrate
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: staging
      url: ${{ vars.STAGING_APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.3'

      - name: Terraform init
        working-directory: infra/terraform/staging
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: infra/terraform/staging
        run: terraform plan -input=false -out=tfplan
        env:
          TF_VAR_image_tag: ${{ needs.build-and-push.outputs.image_tag }}
          TF_VAR_fly_api_token: ${{ secrets.FLY_API_TOKEN }}
          TF_VAR_database_url: ${{ secrets.STAGING_DATABASE_URL }}
          TF_VAR_secret_key: ${{ secrets.STAGING_SECRET_KEY }}

      - name: Terraform apply
        working-directory: infra/terraform/staging
        run: terraform apply -input=false -auto-approve tfplan
        env:
          TF_VAR_image_tag: ${{ needs.build-and-push.outputs.image_tag }}
          TF_VAR_fly_api_token: ${{ secrets.FLY_API_TOKEN }}
          TF_VAR_database_url: ${{ secrets.STAGING_DATABASE_URL }}
          TF_VAR_secret_key: ${{ secrets.STAGING_SECRET_KEY }}

      # Migrations run against staging using the same code path as local/CI.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.5.11'

      - name: Run migrations
        working-directory: backend
        run: |
          uv python install 3.12
          uv sync --frozen
          uv run python -m app.db.migrate
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          SECRET_KEY: ${{ secrets.STAGING_SECRET_KEY }}
          APP_ENV: staging

      - name: Record deployed tag for rollback
        run: echo "Deployed image tag ${{ needs.build-and-push.outputs.image_tag }}" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke tests against staging
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf "${{ vars.STAGING_API_URL }}/health"; then exit 0; fi
            sleep 5
          done
          echo "staging /health did not respond" >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: yarn playwright install --with-deps chromium

      - name: Playwright smoke suite against staging
        working-directory: frontend
        run: yarn test:e2e
        env:
          E2E_BASE_URL: ${{ vars.STAGING_APP_URL }}
